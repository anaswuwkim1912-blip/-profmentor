<style>
:root{--bg:#f7f4ed;--card:#fffdf8;--line:#ded9cf;--muted:#6d726e;--tx:#202522;--green:#287b61;--mint:#b9e6d4;--chip:#ebe8e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,"Helvetica Neue",sans-serif}
header{min-height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 6%;background:#faf8f2}
.logo{font-size:22px;font-weight:800}.logo span{font-weight:400}.badge{color:var(--green);font-size:13px}
main{max-width:1050px;margin:auto;padding:45px 20px 70px}
.hero{text-align:center;max-width:800px;margin:4vh auto}

p{line-height:1.6;color:var(--muted)}.hero p{font-size:18px}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0}
.feature,.card,.prof{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left}
.feature b{display:block;color:var(--green);margin-bottom:8px}
button{font:inherit;border:0;border-radius:13px;padding:14px 20px;font-size:16px;cursor:pointer}
.primary{background:var(--tx);color:#fff}.secondary{background:var(--card);color:var(--tx);border:1px solid var(--tx)}
.testhead{display:flex;justify-content:space-between;align-items:end;gap:16px}
.progress{width:240px;height:6px;background:var(--line);border-radius:10px;margin-top:8px}.bar{height:100%;background:var(--green);border-radius:10px}
.card{margin-top:22px;padding:30px}.question{font-size:clamp(24px,4.5vw,36px);line-height:1.15;letter-spacing:-.03em;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:14px}
.opt.sel{border-color:var(--green);background:var(--mint)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.sg label{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.traits strong{display:block;margin-bottom:7px}.traits span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.prof h3{font-size:22px}.match{color:var(--green);font-weight:bold;white-space:nowrap}.top{display:flex;justify-content:space-between;gap:10px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:bold;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.chip{font-size:12px;background:var(--chip);border-radius:20px;padding:7px 9px}
.prof ol{padding-left:1.2em;margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.stars{color:var(--green);letter-spacing:2px}
.note{font-size:13px;color:var(--muted);margin:20px 0}
footer{border-top:1px solid var(--line);padding:20px 6%;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:700px){.features,.traits,.grid{grid-template-columns:1fr}.testhead{display:block}.progress{width:100%}.card{padding:22px}}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}main{padding:0}.prof,.feature{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

 k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?"":c)));return e}
function show(...x){app.replaceChildren(...x);scrollTo(0,0)}
const card=(...k)=>el("div",{class:"card"},...k);
const chips=a=>el("div",{class:"chips"},a.map(x=>el("span",{class:"chip"},x)));

function start(){
 sc={};DK.forEach(k=>sc[k]=0);asked=[];n=0;
 show(el("div",{class:"hero"},el("div",{class:"eyebrow"},"10–20 вопросов"),
  el("h1",{},"Найди профессию, которая подходит именно тебе"),
  el("p",{},"Тест анализирует твои интересы и оценки, а каждый следующий вопрос подбирается по твоим предыдущим ответам. В конце ты получишь подходящие профессии, предметы ЕГЭ, список вузов и прогноз на 20 лет."),
  el("div",{class:"features"},[["01","Вопросы, зависящие от ответов"],["02","Учёт школьных оценок"],["03","Профессии, ЕГЭ и вузы"],["04","Прогноз на 20 лет"]].map(f=>el("div",{class:"feature"},el("b",{},f[0]),f[1]))),
  el("button",{class:"primary",onclick:grades},"Начать тест")));
}
function grades(){
 const sel=SUBJ.map(s=>el("select",{},[["","—"],["5","5"],["4","4"],["3","3"]].map(o=>el("option",{value:o[0]},o[1]))));
 const go=()=>{sel.forEach((s,i)=>{const g=+s.value;if(g>=4)SUBJ[i][1].split(",").forEach(d=>sc[d]+=(g-3)*0.5)});next()};
 show(el("div",{class:"eyebrow"},"Шаг 1"),el("h1",{style:"font-size:clamp(30px,5vw,46px)"},"Твои оценки"),
  card(el("p",{style:"margin-top:0"},"Выбери свои оценки по предметам, чтобы результат был точнее. Шаг необязательный, его можно пропустить."),
   el("div",{class:"sg"},SUBJ.map((s,i)=>el("label",{},s[0],sel[i]))),
   el("div",{class:"row"},el("button",{class:"secondary",onclick:next},"Пропустить"),el("button",{class:"primary",onclick:go},"Начать вопросы"))));
}
function pick(){
 if(n<6)return n;
 const r=DK.slice().sort((a,b)=>sc[b]-sc[a]),w={};[3,2,1].forEach((v,i)=>w[r[i]]=v);
 let b=-1,bs=-1;
 Q.forEach((q,i)=>{if(asked.includes(i))return;const s=q.o.reduce((t,o)=>t+(w[o.d]||0),0);if(s>bs){bs=s;b=i}});
 return b;
}
function next(){
 if(n>=TOTAL||asked.length>=Q.length)return results();
 const i=pick();asked.push(i);const q=Q[i];let sel=null;
 const btns=q.o.map(o=>{const b=el("button",{class:"opt",onclick:()=>{sel=o;btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}},o.t);return b});
 const add=()=>{if(sel){sc[sel.d]+=2;n++}};
 show(el("div",{class:"testhead"},el("div",{},el("div",{class:"eyebrow"},"Профориентация"),el("h2",{},"Вопрос "+(n+1))),
   el("div",{},el("span",{},(n+1)+" / "+TOTAL),el("div",{class:"progress"},el("div",{class:"bar",style:"width:"+((n+1)/TOTAL*100)+"%"})))),
  card(el("div",{class:"question"},q.q),btns,
   el("div",{class:"row"},n>=MINEND?el("button",{class:"secondary",onclick:()=>{add();results()}},"Завершить тест досрочно"):null,
    el("button",{class:"primary",onclick:()=>{if(!sel){alert("Выбери вариант ответа, пожалуйста.");return}add();next()}},"Продолжить"))));
}
function results(){
 const tot=DK.reduce((t,k)=>t+sc[k],0)||1;
 const top=DK.slice().sort((a,b)=>sc[b]-sc[a]).slice(0,3);
 const labels=["Очень высокое совпадение","Высокое совпадение","Хорошее совпадение","Хорошее совпадение"];
 const list=P.map(p=>({p,s:sc[p.d[0]]+0.6*sc[p.d[1]]})).sort((a,b)=>b.s-a.s).slice(0,4);
 const cards=list.map((x,i)=>{const p=x.p;
  return el("article",{class:"prof"},el("div",{class:"top"},el("h3",{},p.n),el("div",{class:"match"},labels[i])),
   el("p",{},"Подходит тебе благодаря интересу к направлениям «"+D[p.d[0]]+"» и «"+D[p.d[1]]+"»."),
   el("div",{class:"label"},"Предметы для сдачи на ЕГЭ"),chips(p.e),
   el("div",{class:"label"},"Что изучать сейчас"),chips(p.s),
   el("div",{class:"label"},"Востребованность на 20 лет"),el("div",{class:"stars"},"★".repeat(p.r)+"☆".repeat(5-p.r)),el("p",{style:"margin:6px 0 0"},p.o),
   el("div",{class:"label"},"Топ-10 вузов России"),el("ol",{},U[p.d[0]].split(";").map(u=>el("li",{},u))))});
 show(el("div",{class:"eyebrow"},"Результат"),el("h1",{},"Твой профессиональный профиль"),
  el("p",{},"Больше всего у тебя выражены интересы к направлениям: "+top.map(k=>"«"+D[k]+"»").join(", ")+"."),
  el("div",{class:"traits"},top.map(k=>el("div",{class:"feature"},el("strong",{},D[k]),el("span",{},"Доля в твоих ответах: "+Math.round(100*sc[k]/tot)+"%")))),
  el("h2",{style:"margin-top:45px"},"Подходящие профессии"),el("div",{class:"grid"},cards),
  el("div",{class:"note"},"Результат ориентировочный и не является профессиональным диагнозом. Прогнозы основаны на общих тенденциях и не гарантируют будущее. Перечень предметов ЕГЭ и список вузов зависят от направления подготовки, поэтому перед подачей документов проверь актуальные требования и рейтинги на официальных сайтах вузов."),
  el("div",{class:"row noprint",style:"justify-content:flex-start"},el("button",{class:"primary",onclick:()=>window.print()},"⬇ Сохранить в PDF"),el("button",{class:"secondary",onclick:start},"Пройти заново")),
  el("p",{class:"note noprint"},"В окне печати выбери «Сохранить как PDF»."));
}
start();
</script>
